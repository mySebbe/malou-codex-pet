name: Bug report
description: Report an install, asset, preview, or metadata problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install
        - Spritesheet
        - ChatGPT Web upload or adoption link
        - Preview media
        - Metadata
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      description: If relevant, include the Codex Desktop version you tested with.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest path that reproduces the problem.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include tokens, passwords, private photos, prompt dumps, or personal data.
          required: true
